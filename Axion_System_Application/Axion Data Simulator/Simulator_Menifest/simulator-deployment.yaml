apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-service
  labels:
    app: simulator-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator-service

  template:
    metadata:
      labels:
        app: simulator-service

    spec:
      containers:
        - name: simulator-service-pod
          image: acrmicrodev2210.azurecr.io/axion-simulator:v1
          ports:
            - containerPort: 8000

