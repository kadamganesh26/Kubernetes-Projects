apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin

  template:
    metadata:
      labels:
        app: pgadmin

    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80

          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@test.com"

            - name: PGADMIN_DEFAULT_PASSWORD
              value: "Admin@12345"

          # resources:
          #   limits
          #     cpu: "100m"
          #     memory: "256Mi"
          #   requests:
          #   limits:
          #     cpu: "500m"
          #     memory: "512Mi"
