apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  labels:
    app: ingestion-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service

  template:
    metadata:
      labels:
        app: ingestion-service

    spec:
      containers:
        - name: ingestion-service-pod
          image: acrmicrodev567.azurecr.io/ingestion-service:v5
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service

spec:
  type: ClusterIP

  selector:
    app: ingestion-service

  ports:
    - port: 8000
      targetPort: 8000