apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui

  template:
    metadata:
      labels:
        app: ui

    spec:
      containers:
        - name: ui
          image: acrmicrodev2606.azurecr.io/axion_ui:v02
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ui
spec:
  type: ClusterIP
  selector:
    app: ui

  ports:
    - port: 80
      targetPort: 80