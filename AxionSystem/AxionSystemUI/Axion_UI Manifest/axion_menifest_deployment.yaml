apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui

  template:
    metadata:
      labels:
        app: ui

    spec:
      containers:
        - name: ui
          image: acrmicrodev2210.azurecr.io/axion-ui:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
