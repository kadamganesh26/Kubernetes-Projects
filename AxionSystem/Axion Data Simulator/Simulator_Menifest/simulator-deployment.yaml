apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-service
  labels:
    app: simulator-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator-service

  template:
    metadata:
      labels:
        app: simulator-service

    spec:
      containers:
        - name: simulator-service-pod
          image: acrmicrodev2606.azurecr.io/simulator:v1
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: simulator-service

spec:
  type: ClusterIP

  selector:
    app: simulator-service

  ports:
    - port: 8000
      targetPort: 8000